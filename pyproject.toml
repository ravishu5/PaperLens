[project]
name = "paperlens"
version = "0.1.0"
description = "A research-engineering intelligence layer for AI agents (MCP server)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "arxiv-to-prompt>=0.14.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
paperlens = "paperlens.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test requires network access"]
